<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4CAF50" />
    <meta name="description" content="AI Smart Irrigation Recommendation System - ML-powered predictions with GenAI explanations" />
    
    <title>AI Smart Irrigation System</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
        }

        #root {
            width: 100%;
            min-height: 100vh;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        code {
            font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
                monospace;
        }

        /* Loading spinner while JS loads */
        .js-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            color: white;
            font-size: 1.2rem;
        }

        .spinner-container {
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        noscript {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #d32f2f;
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <noscript>
        <div style="padding: 40px; text-align: center; max-width: 600px; margin: 0 auto;">
            <h1 style="color: #d32f2f; margin-bottom: 20px;">JavaScript is disabled</h1>
            <p>This application requires JavaScript to be enabled. Please enable JavaScript in your browser settings to use the AI Smart Irrigation System.</p>
        </div>
    </noscript>

    <div id="root">
        <div class="js-loading">
            <div class="spinner-container">
                <div class="spinner"></div>
                <p>Loading AI Irrigation System...</p>
            </div>
        </div>
    </div>

    <!-- React DOM will mount here -->
    <!-- The following line is replaced by the build process -->
</body>
</html>
