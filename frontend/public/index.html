<!DOCTYPE html>
<html lang="en" data-type="software">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070c" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <meta name="description" content="Fieldwise — live weather, crop context and model-backed irrigation guidance, presented as a lunar mission-control surface." />

    <title>Fieldwise — Precision irrigation, orchestrated</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Michroma&family=Manrope:wght@300..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/layers/d/sky.webp" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/layers/m/sky.webp" media="(max-width: 767px)" fetchpriority="high" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #05070c;
        }

        #root {
            width: 100%;
            min-height: 100vh;
        }

        /* Loading screen while the bundle boots. */
        .js-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background:
                radial-gradient(60% 50% at 50% 40%, rgba(28, 44, 70, 0.6), transparent 70%),
                #05070c;
            color: #c9ccd3;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .spinner-container {
            text-align: center;
        }

        .spinner {
            border: 1px solid rgba(201, 204, 211, 0.18);
            border-top-color: #6fb6ff;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            animation: spin 1s linear infinite;
            margin: 0 auto 22px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation-duration: 3s; }
        }

        noscript {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #05070c;
            font-family: 'Manrope', sans-serif;
            color: #c9ccd3;
            font-size: 1.05rem;
            padding: 40px;
        }
    </style>
</head>
<body>
    <noscript>
        <div style="text-align: center; max-width: 600px; margin: 0 auto;">
            <h1 style="color: #6fb6ff; margin-bottom: 20px; font-size: 1.4rem; letter-spacing: 0.08em;">JavaScript is disabled</h1>
            <p>This application requires JavaScript to be enabled. Please enable JavaScript in your browser settings to use the Fieldwise irrigation system.</p>
        </div>
    </noscript>

    <div id="root">
        <div class="js-loading">
            <div class="spinner-container">
                <div class="spinner"></div>
                <p>Fieldwise · initialising telemetry</p>
            </div>
        </div>
    </div>

    <!-- React mounts here and replaces the loading surface above. -->
</body>
</html>
